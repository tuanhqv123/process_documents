events {}

http {
  # Docker's embedded DNS — re-resolve upstream IPs at request time so nginx
  # survives backend/frontend container recreations (no stale-IP 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # REST API → backend (host in a variable forces dynamic re-resolution)
    location /api/ {
      set $backend backend;
      proxy_pass http://$backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ESP32 audio + browser monitor WebSockets (matches /ws and /ws/audio-monitor)
    location /ws {
      set $backend backend;
      proxy_pass http://$backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    # Everything else → frontend (includes vite HMR websocket)
    location / {
      set $frontend frontend;
      proxy_pass http://$frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
