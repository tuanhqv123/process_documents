services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdf_processor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdf-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdf-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pdf_processor
      REDIS_URL: redis://redis:6379
      EMBEDDING_SERVICE_URL: http://embedder:8001
      # Set in .env. Local: remote 4090 STT. On the 4090: http://host.docker.internal:2109
      WHISPER_SERVICE_URL: ${WHISPER_SERVICE_URL:-http://host.docker.internal:2109}
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app/api
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: pdf-frontend
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://pdf-backend:8000
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"

  embedder:
    build:
      context: .
      dockerfile: embedder/Dockerfile
    container_name: pdf-embedder
    environment:
      EMBEDDING_MODEL: dangvantuan/vietnamese-embedding
      EMBEDDING_DIM: "768"
    volumes:
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: pdf-nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "2108:80"

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile
    container_name: pdf-whisper
    volumes:
      - ./whisper/main_zipformer.py:/app/main.py
      - ./models/zipformer:/models/zipformer
    ports:
      - "8002:8002"
    environment:
      ZIPFORMER_MODEL_DIR: /models/zipformer
      NUM_THREADS: "4"
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

volumes:
  postgres_data:
  frontend_node_modules:
  hf_cache:
